name: Update early vote page

on:
  schedule:
    - cron: "0 13 * * *"   # about 9:00 Eastern
    - cron: "30 23 * * *"  # about 19:30 Eastern
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

env:
  # Snapshot file names and "exported the day before" cutoffs use local time.
  TZ: America/New_York

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      - name: Restore downloads and rebuilt tables
        uses: actions/cache@v4
        with:
          path: |
            data/raw/nc
            data/raw/eavs
            data/raw/geo
            data/processed/nc
            data/processed/pa
            data/processed/nc_repeat.parquet
            data/processed/eavs.parquet
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Save new snapshots
        run: python -m earlyvote.cli snapshot

      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/snapshots
          if ! git diff --cached --quiet; then
            git commit -m "Snapshot $(date +%Y-%m-%dT%H:%M)"
            git push
          fi

      - name: Build tables and page
        run: python -m earlyvote.cli build

      - run: mkdir -p site && cp reports/earlyvote.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
