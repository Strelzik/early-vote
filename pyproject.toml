[project]
name = "earlyvote"
version = "0.1.0"
description = "US early vote collection and analysis by state, county, and party"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "requests>=2.31",
    "openpyxl>=3.1",
    "lxml>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
earlyvote = "earlyvote.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
earlyvote = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
